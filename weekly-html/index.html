<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>סקירות שווקים שבועיות</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#192e41;font:16px/1.65 system-ui,Arial,sans-serif}main{max-width:920px;margin:auto;padding:35px 18px}h1{font-size:clamp(26px,4vw,38px);margin:0 0 6px}.sub{color:#647588;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}.card{display:block;background:white;border:1px solid #dbe5ee;border-radius:15px;padding:22px;color:#163e63;text-decoration:none;box-shadow:0 4px 14px #10243808}.card:hover{border-color:#398cae;background:#f5fbff}.card strong{display:block;font-size:20px}.card span{font-size:13px;color:#647689}.foot{font-size:12px;color:#67798b;margin-top:35px}</style></head><body><main><h1>סקירות שווקים שבועיות</h1><p class="sub">סיכום שווקים בישראל ובוול סטריט, ביצועי מדדים ולוח אירועים. בחרו שבוע לקריאת הסקירה המלאה.</p><div id="list" class="grid">טוען סקירות…</div><p class="foot">מאת דורון שרייבמן · מידע כללי בלבד, אינו מהווה ייעוץ השקעות.</p></main><script>const list=document.getElementById('list');async function load(){try{const r=await fetch('https://api.github.com/repos/Doronsh170/doron-tools/contents/weekly-html',{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error(r.status);const items=(await r.json()).filter(x=>x.type==='dir'&&/^\d{4}-\d{2}-\d{2}$/.test(x.name)).sort((a,b)=>b.name.localeCompare(a.name));list.replaceChildren();if(!items.length){list.textContent='אין סקירות זמינות כעת';return}for(const x of items){const a=document.createElement('a');a.className='card';a.href='./'+x.name+'/';const d=x.name.split('-').reverse().join('.');const title=document.createElement('strong');title.textContent='סקירה שבועית · '+d;const label=document.createElement('span');label.textContent='לצפייה בסקירה המלאה';a.append(title,label);list.append(a)}}catch(e){list.textContent='לא ניתן לטעון את הארכיון כעת. נסו לרענן את העמוד.'}}load();</script></body></html>
